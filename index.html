<style>
    body
    {
        background-color: black;
        text-align: center;
        font-family: sans-serif;
    }
    h1
    {
        color: white;
        text-shadow: 0 0 10px aqua;
    }
    h2
    {
        color: red;
    }
    img
    {
        border-radius: 50%;
        border: 4px solid white;
        width: 500px;
        height: 500px;
        object-fit: cover;
        box-shadow: 0 0 10px aqua;
    }
    a
    {
        text-decoration: none;
    }
    @keyframes leftRightMove
    {
        0%
        {
            transform: translateX(20px);
        }
        100%
        {
            transform: translateX(-20px);
        }
    }
    a h1
    {
        animation: leftRightMove 1.5s ease-in-out infinite alternate;
        color: greenyellow;
        text-shadow: 0 0 10px red;
    }
    .noFinish
    {
        background-color: rgb(22, 21, 21);
        color: red;
        position: fixed;
        left: 50%;
        top: 50%;
        border: 2px solid red;
        box-shadow: 0 0 25px yellow;
        padding: 10px 20px;
        font-weight: bold;
        border-radius: 5px;
        transform: scale(0.1);
        opacity: 0;
        transition: all 1s;
    }
</style>

<h1>
    Victor LIN Portfolio
</h1>
<h2>
    Projects
</h2>

<img src="assets/images/pbr.png" onclick="clickImage()" alt="Picture of Victor LIN">

<a href="https://victor-lin-portfolio.herokuapp.com/">
    <h1>
        Click Here
    </h1>
</a>

<script>
    function clickImage()
    {
        var n = 100;
        for (var i = 0; i < n; i++)
        {
            // alert("You clicked: " + i + " times!");
            
            setTimeout(() =>
            {
                let box = document.createElement("div");
                box.innerText = "Coming soon...";
                document.body.appendChild(box);
                box.className = "noFinish";
                
                box.offsetHeight;
                
                box.style.left = (Math.random() * 100) + "%";
                box.style.top = (Math.random() * 100) + "%";
                box.style.opacity = "1";
                box.style.transform = `scale(${Math.random() + 0.5})`;
                box.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;
            }, i * 100)
            
        }
    }
</script>
